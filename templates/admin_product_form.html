{% extends 'admin_base.html' %}{% block title %}{{ heading }}{% endblock %}
{% block content %}<div class="admin-page-head"><div><p class="admin-overline"><a href="{{ url_for('admin_products') }}">← QUAY LẠI DANH SÁCH</a></p><h1>{{ heading }}</h1><p>Thông tin sẽ được ghi trực tiếp vào bảng SanPham.</p></div></div>
<div class="panel form-panel"><form method="post" enctype="multipart/form-data" class="form-stack admin-edit-form"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><div class="form-grid"><label>Tên sản phẩm *<input name="name" required maxlength="200" value="{{ p.TenSP if p else '' }}" placeholder="Ví dụ: Áo Polo Cotton"></label><label>Danh mục *<select name="category" required><option value="">Chọn danh mục</option>{% for c in cats %}<option value="{{ c.MaDM }}" {% if p and p.MaDM==c.MaDM %}selected{% endif %}>{{ c.TenDM }}</option>{% endfor %}</select></label><label>Giá bán (VNĐ) *<input type="number" name="price" required min="0" step="1000" value="{{ p.GiaBan|int if p else '' }}" placeholder="299000"></label><label>Trạng thái *<select name="status"><option value="DangKinhDoanh" {% if not p or p.TrangThai=='DangKinhDoanh' %}selected{% endif %}>Đang kinh doanh</option><option value="NgungKinhDoanh" {% if p and p.TrangThai=='NgungKinhDoanh' %}selected{% endif %}>Ngừng kinh doanh</option><option value="HetHang" {% if p and p.TrangThai=='HetHang' %}selected{% endif %}>Hết hàng</option></select></label></div><label>Mô tả sản phẩm<textarea name="description" rows="5" placeholder="Mô tả sản phẩm...">{{ p.MoTa if p and p.MoTa else '' }}</textarea></label><label>Ảnh sản phẩm (không bắt buộc)<input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif"></label>{% if p %}<div class="edit-preview"><img src="{{ product_image(p) }}" alt="Ảnh hiện tại"><span>Ảnh hiện tại. Để trống nếu không muốn thay ảnh.</span></div>{% endif %}<div class="form-actions"><button type="submit" class="admin-btn">Lưu sản phẩm</button><a href="{{ url_for('admin_products') }}" class="outline-btn">Hủy bỏ</a></div></form></div>
{% endblock %}
