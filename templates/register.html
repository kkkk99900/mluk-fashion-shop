{% extends 'base.html' %}
{% block title %}Đăng ký — MLUK{% endblock %}
{% block content %}<section class="auth-page container"><div class="auth-side"><div class="auth-art"><span>MLUK STUDIO</span><strong>Start your<br><em>story.</em></strong><span>THE EVERYDAY COLLECTION</span></div></div><div class="auth-form-box"><p class="eyebrow dark-eyebrow">JOIN THE CLUB</p><h1>Tạo tài khoản.</h1><p>Đăng ký thành viên và bắt đầu mua sắm.</p><form method="post" class="form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label>Họ và tên<input name="fullname" maxlength="100" required placeholder="Nguyễn Văn A"></label><label>Tên đăng nhập<input name="username" pattern="[A-Za-z0-9_]{4,50}" minlength="4" maxlength="50" required placeholder="nguyenvana"></label><label>Email<input name="email" type="email" maxlength="100" required placeholder="ban@example.com"></label><label>Số điện thoại<input name="phone" maxlength="15" required placeholder="0912345678"></label><label>Mật khẩu (từ 8 ký tự)<input type="password" name="password" minlength="8" required></label><button class="btn btn-dark full-width" type="submit">Tạo tài khoản ↗</button></form><div class="auth-bottom">Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></div></div></section>{% endblock %}
